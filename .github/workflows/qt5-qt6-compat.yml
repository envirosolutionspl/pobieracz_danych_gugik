name: Qt5 and Qt6 compatibility checker

on:
  push:
    branches: [master, dev]
    paths:
      - "**.py"
      - ".github/workflows/qt5-qt6-compat.yml"
  pull_request:
    branches: [master, dev]
    paths:
      - "**.py"


jobs:
  qt5-qt6-compat:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: Generate readable report (with dry run flag)
        run: /usr/local/bin/pyqt5_to_pyqt6.py --dry_run --logfile "$GITHUB_WORKSPACE/qt5_qt6_report.log" .
      
      - name: Show report in GH Actions interface
        run: tail -n +2 "$GITHUB_WORKSPACE/qt5_qt6_report.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Real job status
        run: /usr/local/bin/pyqt5_to_pyqt6.py .

      - name: Upload report artifact when failure appears
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qt5-qt6-compat-report
          path: qt5_qt6_report.log
      
